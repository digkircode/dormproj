name: Deploy production
on:
  workflow_dispatch:
  push:
    branches: [master]
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy application to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "backend,frontend,docker-compose.yml,.env.example,README.md,.gitignore"
          target: ${{ secrets.DEPLOY_PATH || '/home/claude/dormproj' }}
          rm: false
      - name: Rebuild services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -eu
            cd '${{ secrets.DEPLOY_PATH || '/home/claude/dormproj' }}'
            test -f .env
            # Build images before touching running containers. This keeps the
            # current version serving traffic during the slow build step.
            docker compose build backend frontend
            docker compose up -d --wait --wait-timeout 180
            docker compose ps
