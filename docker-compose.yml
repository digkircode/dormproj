services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dormproj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dormproj}
      POSTGRES_DB: ${POSTGRES_DB:-dormproj}
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: ${BACKEND_IMAGE:-dormproj-backend}
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dormproj}:${POSTGRES_PASSWORD:-dormproj}@db:5432/${POSTGRES_DB:-dormproj}?schema=public
      EXTERNAL_API_URL: ${EXTERNAL_API_URL}
      EXTERNAL_API_LOGIN: ${EXTERNAL_API_LOGIN}
      EXTERNAL_API_PASSWORD: ${EXTERNAL_API_PASSWORD}
      EXTERNAL_API_INDIVIDUALS_URL: ${EXTERNAL_API_INDIVIDUALS_URL}
      EXTERNAL_API_CITIZENSHIP_URL: ${EXTERNAL_API_CITIZENSHIP_URL}
      EXTERNAL_API_PASSPORT_URL: ${EXTERNAL_API_PASSPORT_URL}
      EXTERNAL_API_CONTACT_INFO_URL: ${EXTERNAL_API_CONTACT_INFO_URL}
      ROSNOU_ID_BASE_URL: ${ROSNOU_ID_BASE_URL}
      ROSNOU_ID_CLIENT_ID: ${ROSNOU_ID_CLIENT_ID}
      ROSNOU_ID_CLIENT_SECRET: ${ROSNOU_ID_CLIENT_SECRET}
      ROSNOU_ID_REDIRECT_URI: ${ROSNOU_ID_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      # 1С Бухгалтерия (см. accounting-1c/) — НЕ прописывать сюда, пока в .env на сервере
      # нет реальных значений. ${VAR} для неустановленной переменной подставляется как
      # ПУСТАЯ СТРОКА, не как отсутствие ключа — а z.string().min(1).optional() пустую
      # строку не принимает (optional() пропускает только настоящий undefined). Раньше
      # (2026-09-04) уже пробовали добавить пятёрку ACCOUNTING_1C_* сюда заранее — сразу
      # уронило прод в краш-луп ("Некорректные переменные окружения"). GPB_ACQUIRING_*/
      # ATOL_KASSA_* — тот же класс опциональных интеграций — сознательно НЕ перечислены
      # здесь вообще, это и есть рабочий способ оставить блок незаполненным. Как появятся
      # реальные логин/пароль/URL — тогда и добавить сюда с реальными значениями разом,
      # не раньше.
    volumes:
      # Вложения чата (фото/видео) — именованный volume, а не слой контейнера: без
      # него файлы терялись бы при каждом `docker compose up --build` (пересоздаёт
      # контейнер), тот же принцип, что db_data ниже для Postgres.
      - chat_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:-dormproj-frontend}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  db_data:
  chat_uploads:
