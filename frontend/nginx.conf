server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Внутренний саброс к бэкенду — server-side проверка сессии до того, как
    # вообще отдаём SPA. Без этого незалогиненный видит секунду пустого экрана,
    # пока грузится и выполняется JS-бандл, и только потом фронт узнаёт (fetch
    # /auth/me), что нужно редиректить.
    location = /_auth_check {
        internal;
        proxy_pass http://backend:3000/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login_redirect {
        return 302 http://$host:3000/auth/rosnou/login;
    }

    location / {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;
        try_files $uri $uri/ /index.html;
    }
}
